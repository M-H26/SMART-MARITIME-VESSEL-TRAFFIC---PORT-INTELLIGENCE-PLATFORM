name: bigdata-lab

x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  AIRFLOW__CORE__FERNET_KEY: ""
  AIRFLOW__WEBSERVER__SECRET_KEY: "change-me-please"
  HDFS_NAMENODE: "hdfs://namenode:9000"
  SPARK_MASTER: "spark://spark-master:7077"
  KAFKA_BOOTSTRAP: "kafka:9092"
  POSTGIS_HOST: "postgis"
  POSTGIS_PORT: "5432"
  POSTGIS_DB: "${POSTGIS_DB}"
  POSTGIS_USER: "${POSTGIS_USER}"
  POSTGIS_PASSWORD: "${POSTGIS_PASSWORD}"

networks:
  maritime-network:
    name: maritime-network

volumes:
  namenode_data:
  datanode_data:
  postgres_data:
  postgis_data:
  kafka_data:
  superset_home:

services:
  # -------------------------------------------------------------------------
  # HDFS
  # -------------------------------------------------------------------------
  namenode:
    image: bde2020/hadoop-namenode:${HADOOP_IMAGE_TAG}
    container_name: namenode
    hostname: namenode
    restart: unless-stopped
    env_file: ./hadoop/hadoop.env
    environment:
      - CLUSTER_NAME=bigdata-lab
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9870/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    ports:
      - "${NAMENODE_UI_PORT}:9870"
      - "${HDFS_RPC_PORT}:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./spark/apps:/opt/spark-apps
    networks: [maritime-network]

  datanode:
    image: bde2020/hadoop-datanode:${HADOOP_IMAGE_TAG}
    container_name: datanode
    hostname: datanode
    restart: unless-stopped
    depends_on: [namenode]
    env_file: ./hadoop/hadoop.env
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    ports:
      - "${DATANODE_UI_PORT}:9864"
    volumes:
      - datanode_data:/hadoop/dfs/data
    networks: [maritime-network]

  # -------------------------------------------------------------------------
  # Mahout - batch ML on Hadoop
  # -------------------------------------------------------------------------
  mahout:
    # apache/mahout:14.1 does NOT exist on Docker Hub (was a bug in the
    # original scaffold). The real, valid tag is apache/mahout-zeppelin:14.1
    # — a preconfigured Zeppelin + Spark + Mahout environment (~3GB download).
    image: apache/mahout-zeppelin:14.1
    container_name: mahout
    hostname: mahout
    restart: unless-stopped
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      HADOOP_CONF_DIR: /etc/hadoop
      HADOOP_HOME: /opt/hadoop
    # This image's default entrypoint starts the Zeppelin notebook server
    # itself, so it stays "Up" on its own — no keep-alive override needed.
    # Zeppelin UI (if you want to use it directly): exposed on port 8080
    # inside the container — add a host port mapping here if needed, e.g.
    # ports: ["8091:8080"], once you know it won't collide with Spark's UI.
    networks: [maritime-network]

  # -------------------------------------------------------------------------
  # HDFS initialisation (one-shot)
  # -------------------------------------------------------------------------
  hdfs-init:
    image: bde2020/hadoop-namenode:${HADOOP_IMAGE_TAG}
    container_name: hdfs-init
    restart: "no"
    depends_on:
      namenode:
        condition: service_healthy
    env_file: ./hadoop/hadoop.env
    entrypoint: >
      bash -c "
      hdfs dfs -mkdir -p /raw /raw/noaa /processed /processed/parquet /curated /models &&
      hdfs dfs -chmod -R 777 /raw /processed /curated /models &&
      echo 'HDFS directories initialized.'
      "
    networks: [maritime-network]

  # -------------------------------------------------------------------------
  # Spark (standalone cluster: 1 master + 1 worker)
  # Packages pinned to match SPARK_IMAGE_TAG (3.3.0)
  # -------------------------------------------------------------------------
  spark-master:
    image: bde2020/spark-master:${SPARK_IMAGE_TAG}
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      - INIT_DAEMON_STEP=setup_spark
      - SPARK_MASTER_OPTS=-Dspark.jars.packages=org.apache.spark:spark-sql-kafka-0-10_2.12:3.3.0,org.postgresql:postgresql:42.6.0
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
      - "${SPARK_MASTER_PORT}:7077"
    volumes:
      - ./spark/apps:/opt/spark-apps
    networks: [maritime-network]

  spark-worker:
    image: bde2020/spark-worker:${SPARK_IMAGE_TAG}
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped
    depends_on: [spark-master]
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=3G
      - SPARK_WORKER_CORES=6
      - SPARK_WORKER_OPTS=-Dspark.jars.packages=org.apache.spark:spark-sql-kafka-0-10_2.12:3.3.0,org.postgresql:postgresql:42.6.0
    ports:
      - "${SPARK_WORKER_UI_PORT}:8081"
    volumes:
      - ./spark/apps:/opt/spark-apps
    networks: [maritime-network]

  jupyter:
    build:
      context: ./jupyter
      args:
        PYSPARK_VERSION: ${PYSPARK_VERSION}
    container_name: jupyter
    hostname: jupyter
    restart: unless-stopped
    depends_on: [spark-master, namenode, kafka]
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=lab
    ports:
      - "${JUPYTER_PORT}:8888"
    volumes:
      - ./jupyter/notebooks:/home/jovyan/work
      - ./spark/apps:/home/jovyan/work/spark-apps
    networks: [maritime-network]

  # -------------------------------------------------------------------------
  # Kafka (KRaft mode - no Zookeeper) + Kafka UI
  # -------------------------------------------------------------------------
  kafka:
    image: apache/kafka:${KAFKA_IMAGE_TAG}
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - CLUSTER_ID=bigdata-lab-kraft-cluster-01
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    ports:
      - "${KAFKA_INTERNAL_PORT}:9092"
      - "${KAFKA_EXTERNAL_PORT}:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [maritime-network]

  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_IMAGE_TAG}
    container_name: kafka-ui
    hostname: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_CLUSTERS_0_NAME=bigdata-lab
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    ports:
      - "${KAFKA_UI_PORT}:8080"
    networks: [maritime-network]

  # One-shot job: creates all project topics then exits (status 0).
  kafka-topics-init:
    image: apache/kafka:${KAFKA_IMAGE_TAG}
    container_name: kafka-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create_topics.sh"]
    volumes:
      - ./kafka/create_topics.sh:/scripts/create_topics.sh:ro
    networks: [maritime-network]
    restart: "no"

  # -------------------------------------------------------------------------
  # PostGIS - spatial serving storage for the maritime platform
  # -------------------------------------------------------------------------
  postgis:
    image: postgis/postgis:${POSTGIS_IMAGE_TAG}
    container_name: postgis
    hostname: postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGIS_USER}
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD}
      POSTGRES_DB: ${POSTGIS_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGIS_USER} -d ${POSTGIS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGIS_EXTERNAL_PORT}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks: [maritime-network]

  # -------------------------------------------------------------------------
  # Superset - visualization for vessel tracks / port maps
  # -------------------------------------------------------------------------
  superset-init:
    image: apache/superset:${SUPERSET_IMAGE_TAG}
    container_name: superset-init
    user: root
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      POSTGIS_USER: ${POSTGIS_USER}
      POSTGIS_PASSWORD: ${POSTGIS_PASSWORD}
      POSTGIS_DB: ${POSTGIS_DB}
    entrypoint: >
      bash -c "
      pip install --no-cache-dir psycopg2-binary >/dev/null &&
      superset db upgrade &&
      (superset fab create-admin --username ${SUPERSET_ADMIN_USER} --password ${SUPERSET_ADMIN_PASSWORD} --firstname Admin --lastname User --email ${SUPERSET_ADMIN_EMAIL} || true) &&
      superset init &&
      superset set-database-uri -d 'Maritime PostGIS' -u 'postgresql+psycopg2://$${POSTGIS_USER}:$${POSTGIS_PASSWORD}@postgis:5432/$${POSTGIS_DB}' &&
      echo 'Superset init complete with Maritime PostGIS datasource.'
      "
    volumes:
      - superset_home:/app/superset_home
    networks: [maritime-network]

  superset:
    image: apache/superset:${SUPERSET_IMAGE_TAG}
    container_name: superset
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    command: >
      bash -c "pip install --no-cache-dir psycopg2-binary >/dev/null && /usr/bin/run-server.sh"
    ports:
      - "${SUPERSET_PORT}:8088"
    volumes:
      - superset_home:/app/superset_home
    networks: [maritime-network]

  # -------------------------------------------------------------------------
  # AIS ingestion - pulls live vessel positions from aisstream.io -> Kafka
  # -------------------------------------------------------------------------
  ais-producer:
    build:
      context: ./ais
    container_name: ais-producer
    hostname: ais-producer
    restart: "no"
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
    command: python /app/ais_stream_producer.py

    environment:
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY}
      KAFKA_BOOTSTRAP: "kafka:9092"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC: "raw_ais_positions"
      AIS_BOUNDING_BOXES: ${AIS_BOUNDING_BOXES}
      AIS_DATA_DIR: "/data"
      MAX_ROWS: "0"

    volumes:
      - ./ais:/app
      - ./data/historical:/data

    networks: [maritime-network]

  # -------------------------------------------------------------------------
  # Airflow (LocalExecutor - single container runs scheduler + webserver)
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG}
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [maritime-network]

  airflow-init:
    build:
      context: ./airflow/docker
      args:
        AIRFLOW_BASE_IMAGE: ${AIRFLOW_BASE_IMAGE}
    image: bigdata-lab-airflow:local
    container_name: airflow-init
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
    entrypoint: >
      bash -c "
      airflow db migrate &&
      (airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email ${AIRFLOW_ADMIN_EMAIL} || true)
      "
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [maritime-network]

  airflow-webserver:
    image: bigdata-lab-airflow:local
    container_name: airflow-webserver
    restart: unless-stopped
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [maritime-network]

  airflow-scheduler:
    image: bigdata-lab-airflow:local
    container_name: airflow-scheduler
    restart: unless-stopped
    hostname: airflow-scheduler
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [maritime-network]
